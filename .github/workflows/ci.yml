name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 与仓库根目录 .python-version 保持一致（开发/CI 统一用 3.11，
          # 避免本地高版本 Python 放行、CI 3.11 报 f-string 兼容性 SyntaxError）
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests (mock engine, zero token)
        env:
          SYNERGYOS_FORCE_MOCK: "1"
        run: pytest tests/ -q
